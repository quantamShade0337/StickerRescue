name: StickerRescue
options:
  deploymentTarget:
    iOS: 17.0
settings:
  base:
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: 6.0

schemes:
  StickerRescue:
    shared: true
    build:
      targets:
        StickerRescue: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StickerRescueTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  StickerRescue:
    type: application
    platform: iOS
    bundleId: com.ethansoh.StickerRescue
    sources:
      - path: Sources
        type: syncedFolder
      - path: Resources
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ethansoh.StickerRescue
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: Sources/StickerRescue-Bridging-Header.h
    dependencies:
      - framework: Vendor/WebP.xcframework
        embed: false

  StickerRescueTests:
    type: bundle.unit-test
    platform: iOS
    bundleId: com.ethansoh.StickerRescue.Tests
    sources:
      - path: Tests
        type: syncedFolder
    settings:
      base:
        INFOPLIST_FILE: Tests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ethansoh.StickerRescue.Tests
    dependencies:
      - target: StickerRescue
